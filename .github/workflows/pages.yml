name: 发布演示站到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: 读取 Pages 配置
        id: pages
        uses: actions/configure-pages@v6
      - name: 安装依赖
        run: npm ci
      - name: 构建演示站
        run: npm run build -w docs -- --base "${PAGES_BASE_PATH%/}/"
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: 上传站点
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist
      - name: 发布站点
        id: deployment
        uses: actions/deploy-pages@v5
